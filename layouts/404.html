{{- define "main" }}
<div class="not-found-container" style="text-align: center; padding: 4.5rem 1rem;">
    <div class="not-found" style="font-size: 5.5rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 1rem;">404</div>
    <h2 style="font-size: 1.75rem; margin-bottom: 1rem; font-weight: 700;">Page Not Found</h2>
    <p style="color: var(--secondary); max-width: 480px; margin: 0 auto 2rem auto; font-size: 1.05rem; line-height: 1.6;">
        Sorry, the page you are looking for does not exist, has been moved, or is temporarily unavailable.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn-primary" style="display: inline-block; padding: 0.65rem 1.5rem; border-radius: var(--radius); background: #0057b8; color: #ffffff; font-weight: 600; text-decoration: none; transition: transform 0.15s ease;">Back to Home</a>
        <a href="/search/" class="btn-secondary" style="display: inline-block; padding: 0.65rem 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); color: var(--primary); font-weight: 600; text-decoration: none; transition: transform 0.15s ease;">Search Site</a>
    </div>
</div>
{{- end }}
